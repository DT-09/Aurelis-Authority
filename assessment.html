<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Aurelis Authority — Assessment</title><link rel="stylesheet" href="/src/styles.css"></head><body><main class="section" style="padding-top:150px"><p class="eyebrow">PRIVATE ASSESSMENT</p><h1 style="font-family:'Bodoni Moda',Georgia,serif;font-size:clamp(44px,6vw,76px);font-weight:500">Assessment workspace</h1><p class="lead">This route is scoped to an issued assessment access token. No generic account or public login is used.</p><div id="assessment" class="finding-card"><div><p class="finding-id">Loading</p><h3>Retrieving assessment scope</h3><p>Assessment data is requested without caching.</p></div></div></main><script>const token=location.pathname.split('/').filter(Boolean).pop();fetch('/api/assessment/'+encodeURIComponent(token),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Assessment unavailable');return r.json()}).then(d=>{document.querySelector('#assessment').innerHTML='<div><p class="finding-id">'+d.assessment.id+'</p><h3>'+d.assessment.agent_name+'</h3><p>'+d.assessment.summary+'</p><p><b>Status:</b> '+d.assessment.status+'</p><p><b>Workflow:</b> '+d.assessment.workflow_name+'</p></div><div><p class="finding-id">FINDINGS</p><p>'+d.findings.length+' recorded</p><p class="finding-id">TESTS</p><p>'+d.tests.length+' recorded</p></div>'}).catch(()=>{document.querySelector('#assessment').innerHTML='<div><p class="finding-id">ACCESS UNAVAILABLE</p><h3>This assessment link is invalid or unavailable.</h3><p>No assessment information has been exposed.</p></div>'})</script></body></html>
